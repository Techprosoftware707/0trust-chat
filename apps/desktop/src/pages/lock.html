<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Locked</title>
    <link rel="stylesheet" href="pages.css" />
    <script src="lock.js" defer></script>
  </head>
  <body>
    <main class="lock">
      <div class="card">
        <span class="lock-badge" aria-hidden="true">
          <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <h1 id="title">Lumen Secure is locked</h1>
        <p class="muted small">Welcome back. Enter your app PIN to continue.</p>
        <form id="form" novalidate>
          <div class="field">
            <label for="pin" class="small">PIN</label>
            <input id="pin" type="password" autocomplete="off" inputmode="numeric" maxlength="64" required />
          </div>
          <div id="error" class="alert alert-error" role="alert" hidden></div>
          <button id="unlock" class="btn btn-primary btn-block" type="submit">Unlock</button>
        </form>
        <button id="touchid" class="btn btn-block" type="button" hidden>Unlock with Touch ID</button>
      </div>
    </main>
  </body>
</html>
