# XcodeGen spec for the Lumen Secure iPhone/iPad app.
#   brew install xcodegen   (2.46.0 or later)
#   cd apps/ios && xcodegen generate
# White-label and deployment settings are build settings (see README.md):
#   LUMEN_BUNDLE_ID, LUMEN_DEFAULT_SERVER, LUMEN_DISPLAY_NAME, LUMEN_PUSH_APP_ID,
#   LUMEN_ASSOCIATED_DOMAIN + LUMEN_ENTITLEMENTS_FILE, DEVELOPMENT_TEAM.
name: Lumen

options:
  bundleIdPrefix: io.lumen
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  transitivelyLinkDependencies: false

packages:
  MatrixRustSDK:
    url: https://github.com/matrix-org/matrix-rust-components-swift
    exactVersion: "26.10.02"
  LumenCore:
    path: LumenCore

settings:
  base:
    LUMEN_BUNDLE_ID: io.lumen.secure
    LUMEN_APP_GROUP: group.$(LUMEN_BUNDLE_ID)
    LUMEN_DEFAULT_SERVER: ""
    LUMEN_DISPLAY_NAME: Lumen
    LUMEN_PUSH_APP_ID: $(LUMEN_BUNDLE_ID).ios
    LUMEN_ASSOCIATED_DOMAIN: ""
    LUMEN_ENTITLEMENTS_FILE: Lumen.entitlements
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
  configs:
    Debug:
      LUMEN_APS_ENVIRONMENT: development
    Release:
      LUMEN_APS_ENVIRONMENT: production

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
        excludes:
          - "Supporting/*.entitlements"
          - "Supporting/Info.plist"
    dependencies:
      - package: MatrixRustSDK
      - package: LumenCore
      - target: LumenNSE
        embed: true
    settings:
      base:
        PRODUCT_NAME: Lumen
        PRODUCT_BUNDLE_IDENTIFIER: $(LUMEN_BUNDLE_ID)
        INFOPLIST_FILE: Lumen/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lumen/Supporting/$(LUMEN_ENTITLEMENTS_FILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    postBuildScripts:
      - name: Bundle the call widget
        path: scripts/copy-call-widget.sh
        basedOnDependencyAnalysis: false
        showEnvVars: false

  LumenNSE:
    type: app-extension
    platform: iOS
    sources:
      - path: LumenNSE
        excludes:
          - "*.entitlements"
          - "Info.plist"
      - path: Lumen/Shared
        group: LumenNSE/Shared
    dependencies:
      - package: MatrixRustSDK
      - package: LumenCore
    settings:
      base:
        PRODUCT_NAME: LumenNSE
        PRODUCT_BUNDLE_IDENTIFIER: $(LUMEN_BUNDLE_ID).LumenNSE
        INFOPLIST_FILE: LumenNSE/Info.plist
        CODE_SIGN_ENTITLEMENTS: LumenNSE/LumenNSE.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  LumenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LumenTests
      - path: LumenCore/Tests/LumenCoreTests
        group: LumenTests/LumenCoreTests
      - path: Lumen/Shared/AppEnvironment.swift
        group: LumenTests/AppSources
      - path: Lumen/Shared/ClientFactory.swift
        group: LumenTests/AppSources
      - path: Lumen/Shared/NotificationMapping.swift
        group: LumenTests/AppSources
      - path: ../shared/test-vectors
        type: folder
        buildPhase: resources
    dependencies:
      - package: LumenCore
      - package: MatrixRustSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUMEN_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        # Logic tests: no host app, so the Rust SDK is linked exactly once.
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  LumenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LumenUITests
    dependencies:
      - target: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUMEN_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lumen

schemes:
  Lumen:
    build:
      targets:
        Lumen: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LumenTests
        - LumenUITests
    run:
      config: Debug
    archive:
      config: Release
