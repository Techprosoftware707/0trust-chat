# Build-machine settings (the shared build host runs timing-sensitive tests: keep it light)
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.daemon.jvmargs=-Xmx2g
# Retry transient repository errors (Maven Central answers 429 to busy shared hosts)
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Lumen build configuration (override with -P or ~/.gradle/gradle.properties) ----
# Application ID for white-label builds (also the SSO/deep-link URL scheme).
lumen.applicationId=io.lumen.secure
# Pre-filled server name (not a URL), e.g. example.com. Empty: the user is asked.
lumen.defaultServer=
# Comma-separated hosts for verified Android App Links (e.g. app.example.com). Empty: none.
lumen.appLinkHosts=
# Version
lumen.versionCode=1
lumen.versionName=1.0.0
# Firebase Cloud Messaging (public identifiers, NOT secrets, but never committed here).
# All four empty: push is disabled and Settings says "Notifications only while the app runs".
lumen.fcm.projectId=
lumen.fcm.appId=
lumen.fcm.apiKey=
lumen.fcm.senderId=
