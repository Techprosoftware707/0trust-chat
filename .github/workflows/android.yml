# Android app: unit tests, lint, debug + release APK, release AAB, instrumented tests on
# an emulator (GitHub's Linux runners have KVM). Release signing only with secrets.
name: android

on:
  push:
    paths:
      - "apps/android/**"
      - "services/chat/**"
      - "design/**"
      - "apps/shared/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: services/chat/package-lock.json
      - name: Build the call widget (bundled into the app's assets)
        working-directory: services/chat
        run: npm ci --ignore-scripts && npm run --if-present build:widget
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Release signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lumen-release.jks"
            echo "LUMEN_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lumen-release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::no ANDROID_KEYSTORE_BASE64 secret: release APK/AAB are UNSIGNED"
          fi
      - name: Debug and release builds
        env:
          LUMEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMEN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMEN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_lumen.defaultServer: ${{ vars.LUMEN_DEFAULT_SERVER }}
          ORG_GRADLE_PROJECT_lumen.fcm.projectId: ${{ vars.LUMEN_FCM_PROJECT_ID }}
          ORG_GRADLE_PROJECT_lumen.fcm.appId: ${{ vars.LUMEN_FCM_APP_ID }}
          ORG_GRADLE_PROJECT_lumen.fcm.apiKey: ${{ vars.LUMEN_FCM_API_KEY }}
          ORG_GRADLE_PROJECT_lumen.fcm.senderId: ${{ vars.LUMEN_FCM_SENDER_ID }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Checksums
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # Debug: only the universal APK (each per-ABI debug split carries the Rust SDK too).
          find app/build/outputs/apk/debug -type f -name '*universal*.apk' -exec cp {} "$RUNNER_TEMP/out/" \;
          find app/build/outputs/apk/release app/build/outputs/bundle/release -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} "$RUNNER_TEMP/out/" \;
          ls -la "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out" && sha256sum * | tee SHA256SUMS-android.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-android
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/test-results
          retention-days: 7

  instrumented:
    name: Instrumented tests (emulator)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-instrumented-reports
          path: apps/android/app/build/reports/androidTests
          retention-days: 7
