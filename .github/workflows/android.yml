# Android app: unit tests, lint, debug + release APK, release AAB, screenshots of every screen
# (Robolectric), instrumented tests on an emulator (GitHub's Linux runners have KVM), and the app
# end to end against a real Lumen server installed on the runner (install.sh --test). Release
# signing only with secrets.
name: android

on:
  push:
    paths:
      - "apps/android/**"
      - "services/chat/**"
      - "design/**"
      - "apps/shared/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: services/chat/package-lock.json
      - name: Build the call widget (bundled into the app's assets)
        working-directory: services/chat
        run: npm ci --ignore-scripts && npm run --if-present build:widget
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Release signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lumen-release.jks"
            echo "LUMEN_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lumen-release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::no ANDROID_KEYSTORE_BASE64 secret: release APK/AAB are UNSIGNED"
          fi
      - name: Test-build signing key (optional)
        env:
          TEST_KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          LUMEN_ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$TEST_KEYSTORE_B64" ]; then
            echo "::notice::no ANDROID_TEST_KEYSTORE_BASE64 secret: debug APKs are signed with this run's own debug key, so an installed test build must be uninstalled before installing one from another run"
            exit 0
          fi
          ks="$RUNNER_TEMP/lumen-test.p12"
          # Copying from a terminal can add line breaks or spaces: whitespace is ignored.
          if ! printf '%s' "$TEST_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$ks" 2>/dev/null; then
            echo "::error::ANDROID_TEST_KEYSTORE_BASE64 is not a complete base64 copy of the key. Paste the whole output of: cat ~/lumen-test-key/ANDROID_TEST_KEYSTORE_BASE64.txt (or: base64 -w 76 ~/lumen-test-key/lumen-test.p12)"
            exit 1
          fi
          # The generated password has no whitespace; a copied one may have picked some up.
          TEST_KS_PW="$(printf '%s' "$LUMEN_ANDROID_TEST_KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          echo "::add-mask::$TEST_KS_PW"
          export TEST_KS_PW
          if ! keytool -list -keystore "$ks" -storetype pkcs12 -storepass:env TEST_KS_PW -alias lumen-test > /dev/null 2>&1; then
            echo "::error::the test key does not open with ANDROID_TEST_KEYSTORE_PASSWORD (${#TEST_KS_PW} characters; the generated one has 32; a copy made by double-clicking stops at a '/'), or has no entry 'lumen-test'. Decoded key: $(stat -c %s "$ks") bytes, SHA-256 $(sha256sum "$ks" | cut -d' ' -f1). If that matches 'stat -c %s' and 'sha256sum' of ~/lumen-test-key/lumen-test.p12, re-enter the password secret; otherwise re-paste the key secret."
            exit 1
          fi
          # Public: compare with the fingerprint make-test-signing-key.sh printed.
          keytool -list -v -keystore "$ks" -storetype pkcs12 -storepass:env TEST_KS_PW -alias lumen-test | grep -m1 'SHA256:'
          echo "LUMEN_ANDROID_TEST_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"
      - name: Debug and release builds
        env:
          LUMEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMEN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMEN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LUMEN_ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_lumen.defaultServer: ${{ vars.LUMEN_DEFAULT_SERVER }}
          ORG_GRADLE_PROJECT_lumen.fcm.projectId: ${{ vars.LUMEN_FCM_PROJECT_ID }}
          ORG_GRADLE_PROJECT_lumen.fcm.appId: ${{ vars.LUMEN_FCM_APP_ID }}
          ORG_GRADLE_PROJECT_lumen.fcm.apiKey: ${{ vars.LUMEN_FCM_API_KEY }}
          ORG_GRADLE_PROJECT_lumen.fcm.senderId: ${{ vars.LUMEN_FCM_SENDER_ID }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease :app:assembleDebugAndroidTest
      - name: Checksums
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # Debug (installable test build, debug key): the universal APK and the arm64-v8a one,
          # which is what nearly every phone needs and a quarter of the size.
          find app/build/outputs/apk/debug -type f \( -name '*universal*.apk' -o -name '*arm64-v8a*.apk' \) -exec cp {} "$RUNNER_TEMP/out/" \;
          find app/build/outputs/apk/release app/build/outputs/bundle/release -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} "$RUNNER_TEMP/out/" \;
          ls -la "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out" && sha256sum * | tee SHA256SUMS-android.txt
          # Which key signed the test build (the same fingerprint on every run once the
          # ANDROID_TEST_KEYSTORE_* secrets are set).
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs *arm64-v8a-debug.apk | grep -E 'SHA-256' | tee test-signing-certificate.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-android
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 14
      - name: Test APKs for the end-to-end job
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-apks"
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/e2e-apks/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-e2e-apks
          path: ${{ runner.temp }}/e2e-apks/*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/test-results
          retention-days: 7

  screenshots:
    # Every screen rendered from the real composables with fake state (Robolectric native graphics,
    # Roborazzi): phones at 360 and 411 dp, a tablet at 840 dp, light and dark, 150 % and 200 % text.
    name: Screenshots (every screen, sizes, themes, large text)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Render the screens
        run: ./gradlew --no-daemon :app:screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-screenshots
          path: apps/android/app/build/outputs/roborazzi
          if-no-files-found: error
          retention-days: 7

  instrumented:
    name: Instrumented tests (emulator)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Enable KVM for the emulator; emulator DNS = the runner's upstream resolvers
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          dns="$(awk '/^nameserver/ && $2 !~ /:/ && $2 !~ /^127\./ {print $2}' /run/systemd/resolve/resolv.conf 2>/dev/null | paste -sd, -)"
          echo "EMULATOR_DNS=${dns:+-dns-server $dns}" >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim ${{ env.EMULATOR_DNS }}
          working-directory: apps/android
          # SdkTlsTest reaches public servers (Let's Encrypt, matrix.org, badssl.com): in CI an
          # unreachable server is a failure, not a skip.
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.LUMEN_TLS_REQUIRE_NETWORK=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-instrumented-reports
          # androidTest-results holds each test's logcat (the LumenTls verdict lines).
          path: |
            apps/android/app/build/reports/androidTests
            apps/android/app/build/outputs/androidTest-results
          retention-days: 7

  older-android:
    # minSdk is 26, but the other emulator jobs use API 35: the debug app must also install and
    # start on the oldest supported versions, and the Rust SDK's own TLS stack (certificate
    # verification and revocation through Android's PKIX classes, which differ per version) must
    # work there against public servers. Steps: tests/apps/android-e2e/old-android.sh.
    name: Installs, starts and passes the SDK TLS tests on Android ${{ matrix.version }} (emulator)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, version: "8.0" }
          - { api: 28, version: "9" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-e2e-apks
          path: ${{ runner.temp }}/e2e-apks
      - name: Enable KVM for the emulator; emulator DNS = the runner's upstream resolvers
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          dns="$(awk '/^nameserver/ && $2 !~ /:/ && $2 !~ /^127\./ {print $2}' /run/systemd/resolve/resolv.conf 2>/dev/null | paste -sd, -)"
          echo "EMULATOR_DNS=${dns:+-dns-server $dns}" >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim ${{ env.EMULATOR_DNS }}
          script: bash tests/apps/android-e2e/old-android.sh "$RUNNER_TEMP/e2e-apks/app-x86_64-debug.apk" "$RUNNER_TEMP/older-android" "$RUNNER_TEMP/e2e-apks/app-debug-androidTest.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-api-${{ matrix.api }}
          path: ${{ runner.temp }}/older-android
          retention-days: 7

  server-e2e:
    # The debug app on an emulator against a Lumen server installed on this runner with the
    # installer's test setup (sslip.io names, private test CA, open registration). The emulator
    # trusts the test CA as a user CA, as a tester's phone would; a web user in Playwright
    # Chromium chats with the app. Steps and checks: tests/apps/android-e2e/run.sh.
    # On API 35 and on the oldest supported versions (sign-in, encrypted chat and sign-out on
    # Android 9 and 8.0). A private CA means no revocation check: public certificates are covered
    # by SdkTlsTest in the instrumented and older-android jobs.
    name: ${{ matrix.api == 35 && 'App against a real Lumen server (emulator)' || format('App against a real Lumen server (emulator, Android {0})', matrix.version) }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android 9 and 8.0 run on a phone-sized display (Pixel 3a); the image default there is
          # 320x640 px, where the keyboard hides most of the sign-in screen.
          - { api: 35, version: "15", profile: "" }
          - { api: 28, version: "9", profile: "pixel_3a" }
          - { api: 26, version: "8.0", profile: "pixel_3a" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Runner resources
        run: |
          nproc; free -m; df -h / /mnt || true
          ip -4 -o addr show scope global
          echo "upstream DNS: $(awk '/^nameserver/ {print $2}' /run/systemd/resolve/resolv.conf 2>/dev/null | paste -sd' ')"
          sudo ss -ltnup | awk 'NR == 1 || $5 ~ /:(80|443|8443|3478|7881|788[2-9])$/'
      - name: Free disk space for the server (the installer needs 10 GB on /var/lib)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: services/chat/package-lock.json
      - name: Playwright Chromium (web user) and NSS tools, before the installer touches apt
        working-directory: services/chat
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo apt-get install -y -q --no-install-recommends libnss3-tools
      - name: Install Lumen (installer test setup, no domain)
        run: |
          out="$RUNNER_TEMP/android-e2e"; mkdir -p "$out"
          ip="$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i < NF; i++) if ($i == "src") {print $(i + 1); exit}}')"
          server="${ip//./-}.sslip.io"
          echo "LUMEN_E2E_SERVER=$server" >> "$GITHUB_ENV"
          echo "LUMEN_E2E_OUT=$out" >> "$GITHUB_ENV"
          echo "runner address $ip -> server name $server"
          set +e
          sudo bash install.sh --test --yes --test-ip "$ip" 2>&1 | tee "$out/install-output.txt"
          rc=${PIPESTATUS[0]}
          set -e
          if ! grep -q '^Result: SUCCESS' "$out/install-output.txt"; then
            echo "::error::installer did not report SUCCESS (exit $rc)"; exit 1
          fi
      - name: Installer log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/android-e2e"
          sudo sh -c 'cp /var/log/lumen/install-*.log "$1"/ 2>/dev/null; /opt/lumen/lumenctl status > "$1/lumenctl-status.txt" 2>&1' sh "$RUNNER_TEMP/android-e2e" || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/android-e2e"
      - name: Test CA as a tester gets it (download, compare fingerprint), trusted by the web user's browser
        run: |
          ca="$RUNNER_TEMP/lumen-test-ca.crt"
          curl -fsS "http://$LUMEN_E2E_SERVER/lumen-test-ca.crt" -o "$ca"
          got="$(openssl x509 -in "$ca" -noout -fingerprint -sha256 | cut -d= -f2)"
          want="$(sudo openssl x509 -in /etc/lumen/ca/caddy-local-root.crt -noout -fingerprint -sha256 | cut -d= -f2)"
          [ "$got" = "$want" ] || { echo "::error::downloaded CA $got differs from the server's $want"; exit 1; }
          echo "test CA SHA-256 $got"
          echo "LUMEN_E2E_CA=$ca" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.pki/nssdb"
          [ -f "$HOME/.pki/nssdb/cert9.db" ] || certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n "Lumen test CA" -i "$ca"
          curl -fsS --cacert "$ca" -o /dev/null -w 'https://%{url.host}/healthz: %{http_code}\n' "https://$LUMEN_E2E_SERVER/healthz"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-e2e-apks
          path: ${{ runner.temp }}/e2e-apks
      - name: Enable KVM for the emulator; emulator DNS = the runner's upstream resolvers
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          dns="$(awk '/^nameserver/ && $2 !~ /:/ && $2 !~ /^127\./ {print $2}' /run/systemd/resolve/resolv.conf 2>/dev/null | paste -sd, -)"
          echo "EMULATOR_DNS=${dns:+-dns-server $dns}" >> "$GITHUB_ENV"
          echo "LUMEN_E2E_APK=$RUNNER_TEMP/e2e-apks/app-x86_64-debug.apk" >> "$GITHUB_ENV"
          echo "LUMEN_E2E_TEST_APK=$RUNNER_TEMP/e2e-apks/app-debug-androidTest.apk" >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim ${{ env.EMULATOR_DNS }}
          script: bash tests/apps/android-e2e/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.api == 35 && 'android-server-e2e' || format('android-server-e2e-api-{0}', matrix.api) }}
          path: ${{ runner.temp }}/android-e2e
          retention-days: 7
