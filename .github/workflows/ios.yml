# iOS/iPadOS app: generate the Xcode project (XcodeGen), build and test on simulators,
# unsigned archive. Signed IPA / TestFlight upload only with signing secrets
# (docs/apps/release-ios.md).
name: ios

on:
  push:
    paths:
      - "apps/ios/**"
      - "services/chat/**"
      - "design/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, archive (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: services/chat/package-lock.json
      - name: Build the call widget (bundled into the app)
        working-directory: services/chat
        run: npm ci --ignore-scripts && npm run --if-present build:widget
      - name: Build, test and archive
        env:
          LUMEN_DEFAULT_SERVER: ${{ vars.LUMEN_DEFAULT_SERVER }}
        run: bash apps/ios/scripts/ci-build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lumen-ios
          path: |
            apps/ios/build/*.xcarchive.zip
            apps/ios/build/*.xcresult
            apps/ios/build/SHA256SUMS-ios.txt
            apps/ios/build/Lumen.xcodeproj.zip
          if-no-files-found: warn
          retention-days: 14
