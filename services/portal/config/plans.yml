# Lumen plan catalogue.
#
# Loaded into the database by `manage.py lumen_bootstrap` when a plan code does
# not exist yet. After that, plans are edited in the admin console
# (Plans & entitlements); this file is only the initial seed.
#
# Entitlements are enforced server-side:
#   max_members         workspace members + pending invitations (portal)
#   max_pending_invites open invitations per workspace (portal)
#   upload_max_mb       largest single file a member may upload (homeserver module)
#   media_quota_mb_30d  total uploads per member per rolling 30 days (homeserver module)
#   can_require_mfa     workspace admins may require MFA for chat sign-in (portal + OIDC)
#   priority_support    support requests from members are queued as high priority
#   crm_enabled         business workspace: contacts, pipelines, tasks, timeline (Nexus API)
#   crm_max_contacts    contacts per workspace (Nexus API)
#   vertical_profiles   real-estate and lending business profiles may be enabled (Nexus API)
#
# New keys are added to plans that already exist in the database by lumen_bootstrap
# (never overwriting values an operator changed).
#
# Prices are in the smallest currency unit (cents). `null` means "contact us".
# Paid plans are purchasable only when BILLING_PROVIDER=stripe and the
# stripe_price_* IDs are set.
plans:
  - code: free
    name: Free
    tagline: For individuals and small groups getting started.
    is_free: true
    self_serve: true
    price_monthly_cents: 0
    price_yearly_cents: 0
    sort_order: 10
    entitlements:
      max_members: 5
      max_pending_invites: 5
      upload_max_mb: 25
      media_quota_mb_30d: 1024
      can_require_mfa: false
      priority_support: false
      crm_enabled: true
      crm_max_contacts: 250
      vertical_profiles: false
    features:
      - End-to-end encrypted direct and group chats
      - Device verification and encrypted key backup
      - Federation with other Matrix servers
      - Workspace with up to 5 members
      - 25 MB files, 1 GB of uploads per member every 30 days

  - code: pro
    name: Pro
    tagline: For teams that need room to grow.
    self_serve: true
    price_monthly_cents: 600
    price_yearly_cents: 6000
    stripe_price_monthly: ""
    stripe_price_yearly: ""
    sort_order: 20
    entitlements:
      max_members: 50
      max_pending_invites: 50
      upload_max_mb: 100
      media_quota_mb_30d: 10240
      can_require_mfa: true
      priority_support: false
      crm_enabled: true
      crm_max_contacts: 25000
      vertical_profiles: true
    features:
      - Everything in Free
      - Up to 50 members
      - 100 MB files, 10 GB of uploads per member every 30 days
      - Require two-factor authentication for every member

  - code: business
    name: Business
    tagline: For organisations with stricter requirements.
    self_serve: true
    price_monthly_cents: 1200
    price_yearly_cents: 12000
    stripe_price_monthly: ""
    stripe_price_yearly: ""
    sort_order: 30
    entitlements:
      max_members: 500
      max_pending_invites: 200
      upload_max_mb: 250
      media_quota_mb_30d: 51200
      can_require_mfa: true
      priority_support: true
      crm_enabled: true
      crm_max_contacts: 250000
      vertical_profiles: true
    features:
      - Everything in Pro
      - Up to 500 members
      - 250 MB files, 50 GB of uploads per member every 30 days
      - Priority support queue

  - code: enterprise
    name: Enterprise & self-hosted
    tagline: Run Lumen on your own infrastructure, or a dedicated deployment.
    self_serve: false
    price_monthly_cents: null
    price_yearly_cents: null
    sort_order: 40
    entitlements:
      max_members: 100000
      max_pending_invites: 1000
      upload_max_mb: 1024
      media_quota_mb_30d: 512000
      can_require_mfa: true
      priority_support: true
      crm_enabled: true
      crm_max_contacts: 1000000
      vertical_profiles: true
    features:
      - Dedicated or self-hosted deployment
      - Custom limits and federation policy
      - Assisted onboarding and migration
      - Assigned by an operator (manual billing)
