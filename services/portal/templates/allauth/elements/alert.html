{% load allauth lumen %}<div class="alert alert-{% if 'error' in attrs.level or 'danger' in attrs.level %}danger{% elif 'warning' in attrs.level %}warning{% elif 'success' in attrs.level %}success{% else %}info{% endif %}" role="status">{% if 'error' in attrs.level or 'danger' in attrs.level or 'warning' in attrs.level %}{% icon "triangle-alert" %}{% elif 'success' in attrs.level %}{% icon "check-circle-2" %}{% else %}{% icon "info" %}{% endif %}<div>{% slot message %}{% endslot %}</div></div>
