# Lumen Secure — single-host deployment.
#
# Do not run this file by hand with a plain `docker compose up`: values come
# from /etc/lumen/rendered/compose.env, which install.sh / update.sh generate.
# Use `sudo ./lumenctl compose <args>` for manual operations.
#
# Network exposure (by design):
#   * caddy  — host network, ports 80/443 (TCP+UDP) and the private operator
#              port (default 8443, IP-allow-listed in Caddy + firewall).
#   * livekit — host network (`calls` profile): WebRTC media on the UDP mux ports and
#              ICE/TCP, embedded TURN (UDP + TLS). Its HTTP port (signalling/API)
#              listens on 127.0.0.1 only; clients reach it through Caddy.
#   * sygnal — host network (`push` profile), 127.0.0.1 only: the push gateway that
#              Synapse calls through Caddy; it needs outbound HTTPS to FCM/APNs.
#   * everything else — no published ports. Caddy reaches portal, ops and
#     synapse through Unix sockets in ${LUMEN_SOCKET_DIR}; postgres is on an
#     internal-only network.

name: ${COMPOSE_PROJECT_NAME:-lumen}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging

x-app: &app
  <<: *hardening
  image: ${PORTAL_IMAGE}
  build:
    context: ${LUMEN_REPO_DIR}
    dockerfile: services/portal/Dockerfile
    args:
      PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE}
  pull_policy: never  # built locally by install.sh / update.sh with `docker build`
  # Primary group = socket group, so gunicorn's Unix sockets are reachable by Caddy.
  user: "${UID_APP}:${GID_SOCKETS}"
  group_add:
    - "${GID_SECRETS}"
  env_file:
    - ${LUMEN_RENDERED_DIR}/app.env
  tmpfs:
    - /tmp:size=64m,mode=1777
  pids_limit: 256
  depends_on:
    postgres:
      condition: service_healthy

x-app-env: &app-env
  LUMEN_VERSION: ${LUMEN_VERSION}
  DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password

services:
  postgres:
    <<: *hardening
    image: ${POSTGRES_IMAGE}
    user: "70:70"
    group_add:
      - "${GID_SECRETS}"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_superuser_password
      - postgres_app_password
      - synapse_db_password
    volumes:
      - ${LUMEN_DATA_DIR}/postgres:/var/lib/postgresql/data
      - ${LUMEN_RENDERED_DIR}/postgres:/etc/postgresql:ro
      - ${LUMEN_REPO_DIR}/deploy/templates/postgres/10-lumen-roles.sh:/docker-entrypoint-initdb.d/10-lumen-roles.sh:ro
    tmpfs:
      - /var/run/postgresql:mode=0775,uid=70,gid=70
      - /tmp
    shm_size: 256m
    pids_limit: 512
    stop_grace_period: 90s
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  synapse:
    <<: *hardening
    image: ${SYNAPSE_IMAGE}
    user: "991:991"
    # A crash, OOM kill or hard reboot leaves the unix socket and Twisted's lock behind; the
    # lock names PID 1, which in the restarted container is synapse itself, so it would refuse
    # to listen and crash-loop. Only synapse uses these two paths: clear them, then start.
    entrypoint: ["/bin/sh", "-c", "rm -f /sockets/synapse.sock /sockets/synapse.sock.lock && exec /start.py"]
    group_add:
      - "${GID_SECRETS}"
      - "${GID_SOCKETS}"
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
      PYTHONPATH: /modules
      SSL_CERT_FILE: ${SYNAPSE_SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
    secrets:
      - synapse_pgpass
      - synapse_macaroon
      - synapse_form_secret
      - synapse_registration_secret
      - synapse_oidc_client_secret
      - internal_api_token
      - lkjwt_registration
    volumes:
      - ${LUMEN_DATA_DIR}/synapse:/data
      - ${LUMEN_RENDERED_DIR}/synapse:/config:ro
      - ${LUMEN_REPO_DIR}/services/synapse-module:/modules:ro
      - ${LUMEN_SOCKET_DIR}:/sockets
      - ${CA_BUNDLE_HOST_PATH}:/etc/lumen-ca/ca.crt:ro
      - ${LUMEN_CONFIG_DIR}/ca:/etc/lumen-ca-dir:ro
    tmpfs:
      - /tmp:size=256m
    extra_hosts:
      - "${LUMEN_PRIMARY_DOMAIN}:${EXTRA_HOSTS_IP}"
    pids_limit: 512
    stop_grace_period: 60s
    networks:
      - backend
      - egress
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  portal:
    <<: *app
    command: ["web"]
    environment:
      <<: *app-env
      LUMEN_SURFACE: public
      LUMEN_SOCKET_PATH: /sockets/portal.sock
      GUNICORN_WORKERS: ${PORTAL_WORKERS:-3}
      OIDC_PRIVATE_KEY_FILE: /run/secrets/oidc_private_key
      SYNAPSE_OIDC_CLIENT_SECRET_FILE: /run/secrets/synapse_oidc_client_secret
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      NEXUS_INTEGRATIONS_KEY_FILE: /run/secrets/nexus_integrations_key
      NEXUS_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/nexus_google_client_secret
      NEXUS_SLACK_CLIENT_SECRET_FILE: /run/secrets/nexus_slack_client_secret
      NEXUS_SLACK_SIGNING_SECRET_FILE: /run/secrets/nexus_slack_signing_secret
      NEXUS_GHL_CLIENT_SECRET_FILE: /run/secrets/nexus_ghl_client_secret
      AI_API_KEY_FILE: /run/secrets/ai_api_key
    secrets:
      - django_secret_key
      - postgres_app_password
      - oidc_private_key
      - synapse_oidc_client_secret
      - smtp_password
      - stripe_secret_key
      - stripe_webhook_secret
      - nexus_integrations_key
      - nexus_google_client_secret
      - nexus_slack_client_secret
      - nexus_slack_signing_secret
      - nexus_ghl_client_secret
      - ai_api_key
    volumes:
      - ${LUMEN_SOCKET_DIR}:/sockets
    networks:
      - backend
      - egress

  ops:
    <<: *app
    command: ["web"]
    environment:
      <<: *app-env
      LUMEN_SURFACE: ops
      LUMEN_SOCKET_PATH: /sockets/ops.sock
      GUNICORN_WORKERS: ${OPS_WORKERS:-2}
      SYNAPSE_ADMIN_TOKEN_FILE: /run/secrets/synapse_admin_token
      INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
      OPS_GATEWAY_SECRET_FILE: /run/secrets/ops_gateway_secret
    secrets:
      - django_secret_key
      - postgres_app_password
      - synapse_admin_token
      - internal_api_token
      - ops_gateway_secret
    volumes:
      - ${LUMEN_SOCKET_DIR}:/sockets
      - ${LUMEN_STATUS_DIR}:/var/lib/lumen/status:ro
      - ${LUMEN_AGENT_DIR}:/run/lumen-agent
    # Internal network only: the console has no route to the internet.
    networks:
      - backend

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      LUMEN_SURFACE: worker
      SYNAPSE_ADMIN_TOKEN_FILE: /run/secrets/synapse_admin_token
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      NEXUS_INTEGRATIONS_KEY_FILE: /run/secrets/nexus_integrations_key
      NEXUS_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/nexus_google_client_secret
      NEXUS_SLACK_CLIENT_SECRET_FILE: /run/secrets/nexus_slack_client_secret
      NEXUS_GHL_CLIENT_SECRET_FILE: /run/secrets/nexus_ghl_client_secret
      LUMEN_PORTAL_INTERNAL_URL: http://portal:8000
      LUMEN_OPS_INTERNAL_URL: http://ops:8000
    secrets:
      - django_secret_key
      - postgres_app_password
      - synapse_admin_token
      - smtp_password
      - stripe_secret_key
      - stripe_webhook_secret
      - nexus_integrations_key
      - nexus_google_client_secret
      - nexus_slack_client_secret
      - nexus_ghl_client_secret
    volumes:
      - ${LUMEN_STATUS_DIR}:/var/lib/lumen/status:ro
      - ${CA_BUNDLE_HOST_PATH}:/etc/lumen-ca/ca.crt:ro
    extra_hosts:
      - "${LUMEN_PRIMARY_DOMAIN}:${EXTRA_HOSTS_IP}"
      - "${LUMEN_APP_DOMAIN}:${EXTRA_HOSTS_IP}"
      - "${LUMEN_MATRIX_DOMAIN}:${EXTRA_HOSTS_IP}"
      - "${LUMEN_RTC_DOMAIN}:${RTC_GATEWAY_IP}"
      - "lumen-host:${EXTRA_HOSTS_IP}"
    networks:
      backend: {}
      egress: {}
      rtc:
        ipv4_address: ${RTC_WORKER_IP}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 180 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  # One-shot: database migrations + bootstrap (plans, OIDC client).
  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    profiles: ["tools"]
    environment:
      <<: *app-env
      LUMEN_SURFACE: public
      OIDC_PRIVATE_KEY_FILE: /run/secrets/oidc_private_key
      SYNAPSE_OIDC_CLIENT_SECRET_FILE: /run/secrets/synapse_oidc_client_secret
      # For "lumenctl manage nexus_integrations_rekey" (key rotation, docs/nexus/CONFIG.md).
      NEXUS_INTEGRATIONS_KEY_FILE: /run/secrets/nexus_integrations_key
    secrets:
      - django_secret_key
      - postgres_app_password
      - oidc_private_key
      - synapse_oidc_client_secret
      - nexus_integrations_key
    networks:
      - backend

  caddy:
    <<: *hardening
    image: ${CADDY_IMAGE}
    user: "${UID_CADDY}:${UID_CADDY}"
    group_add:
      - "${GID_SECRETS}"
      - "${GID_SOCKETS}"
    cap_add:
      - NET_BIND_SERVICE
    network_mode: host
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    secrets:
      - ops_gateway_secret
    volumes:
      - ${LUMEN_RENDERED_DIR}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LUMEN_DATA_DIR}/caddy/data:/data
      - ${LUMEN_DATA_DIR}/caddy/config:/config
      - ${LUMEN_SOCKET_DIR}:/sockets
      # Parent directory, so the atomic swap of www/chat on rebuilds is visible without a restart.
      - ${LUMEN_WWW_DIR}:/srv/www:ro
      - ${LUMEN_RENDERED_DIR}/chat:/srv/chat-config:ro
      - ${LUMEN_BRANDING_DIR}:/srv/brand:ro
    tmpfs:
      - /tmp
    pids_limit: 256
    stop_grace_period: 30s

  # WebRTC SFU for 1:1 and group calls (MatrixRTC / Element Call protocol) with
  # embedded TURN. Media is end-to-end encrypted by the clients; the SFU forwards it.
  livekit:
    <<: *hardening
    image: ${LIVEKIT_IMAGE}
    profiles: ["calls"]
    user: "${UID_LIVEKIT}:${UID_LIVEKIT}"
    group_add:
      - "${GID_SECRETS}"
    network_mode: host
    command: ["--config", "/etc/livekit/livekit.yaml"]
    secrets:
      - livekit_keys
    volumes:
      - ${LUMEN_RENDERED_DIR}/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    tmpfs:
      - /tmp:size=64m
    pids_limit: 512
    stop_grace_period: 20s
    healthcheck:
      # The image has no shell tools; LiveKit's own binary cannot probe, so the
      # host-side healthcheck.sh and the worker probe check http://127.0.0.1:7880/.
      disable: true

  # MatrixRTC authorization service (element-hq/lk-jwt-service) as an application
  # service: Synapse proxies /rtc/livekit requests to it (MSC4512); it verifies room
  # membership (MSC4502) and mints short-lived, room-scoped LiveKit tokens.
  lkjwt:
    <<: *hardening
    image: ${LKJWT_IMAGE}
    profiles: ["calls"]
    user: "${UID_LKJWT}:${UID_LKJWT}"
    group_add:
      - "${GID_SECRETS}"
    environment:
      LIVEKIT_URL: wss://${LUMEN_RTC_DOMAIN}
      LIVEKIT_KEY_FILE: /run/secrets/livekit_keys
      LIVEKIT_JWT_BIND: 0.0.0.0:8080
      LIVEKIT_HS_SERVER_NAME: ${MATRIX_SERVER_NAME}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: ${MATRIX_SERVER_NAME}
      LIVEKIT_AS_REGISTRATION_FILE: /run/secrets/lkjwt_registration
      LIVEKIT_CS_API_URL_OVERRIDES: ${MATRIX_SERVER_NAME}=http://synapse:8008
      LIVEKIT_SANITY_CHECK_INTERVAL_SECONDS: "60"
      # warn: INFO lines name the Matrix user and room of every call (metadata stays out of logs).
      LIVEKIT_LOG_LEVEL: warn
      SSL_CERT_FILE: ${LKJWT_SSL_CERT_FILE}
    secrets:
      - livekit_keys
      - lkjwt_registration
    volumes:
      - ${CA_BUNDLE_HOST_PATH}:/etc/lumen-ca/ca.crt:ro
    extra_hosts:
      # LiveKit's API is reached through Caddy on the host (allowed only from this network).
      - "${LUMEN_RTC_DOMAIN}:${RTC_GATEWAY_IP}"
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/lk-jwt-service-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      backend: {}
      rtc:
        ipv4_address: ${RTC_LKJWT_IP}
    depends_on:
      synapse:
        condition: service_healthy

  # Matrix push gateway (element-hq Sygnal, unmodified upstream image) for the mobile
  # apps: Synapse pushers -> Sygnal -> FCM / APNs. Payloads carry no message content.
  sygnal:
    <<: *hardening
    image: ${SYGNAL_IMAGE}
    profiles: ["push"]
    user: "${UID_SYGNAL}:${UID_SYGNAL}"
    group_add:
      - "${GID_SECRETS}"
    network_mode: host
    environment:
      SYGNAL_CONF: /etc/sygnal/sygnal.yaml
      PYTHONDONTWRITEBYTECODE: "1"
    secrets:
      - push_fcm_service_account
      - push_apns_key
    volumes:
      - ${LUMEN_RENDERED_DIR}/sygnal/sygnal.yaml:/etc/sygnal/sygnal.yaml:ro
    tmpfs:
      - /tmp:size=16m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:${PUSH_PORT}/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s

networks:
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  # Fixed addresses so LiveKit (host network) can send webhooks to the authorization
  # service and Caddy can allow LiveKit's API only from this subnet.
  rtc:
    driver: bridge
    ipam:
      config:
        - subnet: ${RTC_NETWORK_SUBNET}
          gateway: ${RTC_GATEWAY_IP}

secrets:
  django_secret_key:
    file: ${LUMEN_SECRETS_DIR}/django_secret_key
  postgres_superuser_password:
    file: ${LUMEN_SECRETS_DIR}/postgres_superuser_password
  postgres_app_password:
    file: ${LUMEN_SECRETS_DIR}/postgres_app_password
  synapse_db_password:
    file: ${LUMEN_SECRETS_DIR}/synapse_db_password
  synapse_pgpass:
    file: ${LUMEN_SECRETS_DIR}/synapse_pgpass
  synapse_macaroon:
    file: ${LUMEN_SECRETS_DIR}/synapse_macaroon
  synapse_form_secret:
    file: ${LUMEN_SECRETS_DIR}/synapse_form_secret
  synapse_registration_secret:
    file: ${LUMEN_SECRETS_DIR}/synapse_registration_secret
  synapse_oidc_client_secret:
    file: ${LUMEN_SECRETS_DIR}/synapse_oidc_client_secret
  synapse_admin_token:
    file: ${LUMEN_SECRETS_DIR}/synapse_admin_token
  oidc_private_key:
    file: ${LUMEN_SECRETS_DIR}/oidc_private_key.pem
  internal_api_token:
    file: ${LUMEN_SECRETS_DIR}/internal_api_token
  ops_gateway_secret:
    file: ${LUMEN_SECRETS_DIR}/ops_gateway_secret
  livekit_keys:
    file: ${LUMEN_SECRETS_DIR}/livekit_keys
  lkjwt_registration:
    file: ${LUMEN_SECRETS_DIR}/lkjwt_registration
  push_fcm_service_account:
    file: ${LUMEN_SECRETS_DIR}/push_fcm_service_account
  push_apns_key:
    file: ${LUMEN_SECRETS_DIR}/push_apns_key
  smtp_password:
    file: ${LUMEN_SECRETS_DIR}/smtp_password
  stripe_secret_key:
    file: ${LUMEN_SECRETS_DIR}/stripe_secret_key
  stripe_webhook_secret:
    file: ${LUMEN_SECRETS_DIR}/stripe_webhook_secret
  nexus_integrations_key:
    file: ${LUMEN_SECRETS_DIR}/nexus_integrations_key
  nexus_google_client_secret:
    file: ${LUMEN_SECRETS_DIR}/nexus_google_client_secret
  nexus_slack_client_secret:
    file: ${LUMEN_SECRETS_DIR}/nexus_slack_client_secret
  nexus_slack_signing_secret:
    file: ${LUMEN_SECRETS_DIR}/nexus_slack_signing_secret
  nexus_ghl_client_secret:
    file: ${LUMEN_SECRETS_DIR}/nexus_ghl_client_secret
  ai_api_key:
    file: ${LUMEN_SECRETS_DIR}/ai_api_key
